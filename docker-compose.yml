# version: '3.8'

services:
  # Core API Server
  flint-core:
    build:
      context: ./flint-core
      dockerfile: Dockerfile
    ports:
      - "3010:3000" # External_portal:internal_port. Map to 3000 inside the container
    env_file:
      - ./flint-core/.env
    environment:
      - NODE_ENV=production
      - DB_HOST=flint-db # Set DB_HOST directly in docker-compose
    depends_on:
      # - db
      flint-db:
        condition: service_healthy
      # - redis
    healthcheck:
      test: ["CMD-SHELL", "wget --spider --quiet \"http://$$HOST:$$PORT/ping\" || exit 1"] #curl --fail -s -o /dev/null http://$HOST:$PORT/api/table/test_connection || exit 1
      interval: 5s
      retries: 10
      start_period: 30s
      timeout: 5s
    restart: unless-stopped

  # React Frontend
  flint-face:
    build:
      context: ./flint-face
      dockerfile: Dockerfile
    ports:
      - "3001:3000" # External_portal:internal_port. Map to 3000 inside the container
    env_file:
      - ./flint-face/.env
    stdin_open: true
    tty: true
    depends_on:
      flint-core: 
        condition: service_healthy
        restart: true
    healthcheck:
      test: curl --fail -s -o /dev/null http://localhost:3000 || exit 1
      interval: 10s
      retries: 3
      start_period: 30s
      timeout: 10s
    restart: unless-stopped

  # Script Execution Service
  flint-worker:
    build:
      context: ./flint-worker
      dockerfile: Dockerfile
    ports:
      - "3002:3000" # External_portal:internal_port. Map to 3000 inside the container
    env_file:
      - ./flint-worker/.env
      # - redis
    restart: unless-stopped

  # Database
  flint-db:
    image: mariadb:lts-ubi9
    # command: --sql_mode=""
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./flint-db/my.cnf:/etc/mysql/my.cnf   # Mount custom my.cnf
      - ./flint-db/db-backups:/docker-entrypoint-initdb.d/db-backups  # Mount the db-backups directory
      - ./flint-db/init.sql.template:/docker-entrypoint-initdb.d/init.sql.template  # Mount the SQL template
      - ./flint-db/init.sql-subst.sh:/docker-entrypoint-initdb.d/init.sql-subst.sh  # Mount the shell script
    env_file:
      - ./flint-db/.env
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      retries: 10
      start_period: 30s
      timeout: 5s
    restart: unless-stopped

  # Cache & Session Store
  # redis:
  #   image: redis:alpine
  #   ports:
  #     - "6379:6379"
  #   volumes:
  #     - redis_data:/data
  #   restart: unless-stopped

  # Vector Database for AI Subconscious Memory
  flint-vector-db:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333" # REST API
      - "6334:6334" # gRPC API
    volumes:
      - vector_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  # Local Embedding Model Service (for converting text to vectors)
  # nomic-embed-text is a highly efficient, open-source embedding model perfect for code and documentation
  flint-embedder:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    entrypoint: ["/bin/sh", "-c"]
    command: >
      '
      ollama serve &
      until ollama list > /dev/null 2>&1; do
        echo "Waiting for Ollama to start...";
        sleep 2;
      done;
      echo "Ollama is up. Pulling model...";
      ollama pull nomic-embed-text;
      echo "Model pulled. Service is ready.";
      wait
      '
    restart: unless-stopped

  # Nginx Reverse Proxy
  nginx:
    build:
      context: ./rproxy
      dockerfile: Dockerfile
    ports:
      - "8090:8081"  # Single entry point
      - "7443:7443" # HTTPS
    depends_on:
      - flint-core
      - flint-face
      - flint-worker

volumes:
  db_data:
  # redis_data:
  vector_data:  # <-- Add this
  ollama_data:  # <-- Add this